services:
  - type: web
    name: bakery-shop
    runtime: docker
    plan: free
    healthCheckPath: /index.php
    envVars:
      - key: MYSQL_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        value: "3306"
      - key: MYSQL_DATABASE
        value: bakery_shop_db
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQLHOST
        sync: false
      - key: MYSQLUSER
        sync: false
      - key: MYSQLPASSWORD
        sync: false
      - key: MYSQLDATABASE
        sync: false
      - key: MYSQLPORT
        sync: false
      - key: RAILWAY_TCP_PROXY_DOMAIN
        sync: false
      - key: RAILWAY_TCP_PROXY_PORT
        sync: false
